name: Validate UV library
on: [push, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r config/requirements.txt
      - run: python config/tools/test_registration.py
      - run: python config/tools/validate_library.py
      - run: python config/tools/validate_all_seams.py
